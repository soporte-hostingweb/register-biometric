server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    location = /push-sw.js {
        default_type application/javascript;
        add_header Cache-Control "no-cache";
    }

    # Gzip Compression
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml image/png image/jpeg;
    gzip_min_length 1000;

    # Expo genera nombres con hash para bundles y recursos. Se pueden guardar
    # de forma permanente y así las siguientes visitas no descargan de nuevo
    # varios megabytes de JavaScript, fuentes e imágenes.
    location ^~ /_expo/static/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        # El HTML debe revalidarse para detectar inmediatamente cada despliegue.
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
