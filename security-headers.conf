# Cabeceras de seguridad de la app de asistencia (auditoría 12-11-2026).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=(), payment=()" always;
